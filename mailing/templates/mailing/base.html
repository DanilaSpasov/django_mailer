<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
        <a class="navbar-brand" href="{% url 'mailing:recipient_list' %}">
            Сервис рассылок
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'mailing:recipient_list' %}">
                Получатели
            </a>
            <a class="nav-link" href="{% url 'mailing:message_list' %}">
                Сообщения
            </a>
            <a class="nav-link" href="{% url 'mailing:mailing_list' %}">
                Рассылки
            </a>
        </div>

        {% if user.is_authenticated %}
            <span class="navbar-text ms-auto">
                {{ user.email }}
            </span>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
